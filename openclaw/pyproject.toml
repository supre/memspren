[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memcli"
version = "0.4.0"
description = "memspren pipeline CLI — OpenClaw skill command dispatcher"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
memcli = "memcli.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["memcli*"]

[tool.pytest.ini_options]
testpaths = ["scripts/memcli/tests"]
pythonpath = ["scripts"]
